[package]
name = "orpheus-core"
version = "0.1.0"
description = "Orpheus's engine: library, sets, clubs, audio, Spotify and analysis, without a UI"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "orpheus_core"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
symphonia = { version = "0.5", features = ["all"] }
# "realtime": the output callbacks run at real-time priority.
cpal = { version = "0.18", features = ["realtime"] }
# Real-time priority for the deck threads that feed the outputs.
audio_thread_priority = { version = "0.35", default-features = false }
signalsmith-stretch = "0.1"
# Alternative time-stretch engines (vendored C++ sources, built with cc).
soundtouch = "0.5"
bungee-rs = "0.1"
# Rubber Band (GPL): R3 engine, high quality.
rubberband = "0.1"
rtrb = "0.4"
midir = "0.11"
blake3 = "1"
lofty = "0.25"
walkdir = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
rayon = "1"
rustfft = "6"
hound = "3"
# Loudness (EBU R128, LUFS) and true peak, for levelling songs.
ebur128 = "0.1"
thread-priority = "3"
stem-splitter-core = { version = "1.2", default-features = false }
base64 = "0.22"
# Announcements: Kokoro text-to-speech on ONNX Runtime (same version and
# features as stem-splitter-core's), misaki and espeak-ng (pure Rust) phonemes.
ort = { version = "=2.0.0-rc.11", features = ["download-binaries"] }
misaki-rs = { version = "0.6", default-features = false }
regex = "1"
espeak-ng = { version = "0.2", default-features = false, features = ["bundled-data-en", "bundled-data-es", "bundled-data-fr", "bundled-data-it", "bundled-data-pt", "bundled-data-hi"] }
open = "5"
toml = { version = "1.1.8", features = ["preserve_order"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "0.2.38"
toml_edit = "0.25.17"
rusty-chromaprint = "0.3.0"
unicode-normalization = "0.1"

# On Linux, ask RealtimeKit (over D-Bus) for real-time scheduling; works without root.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
cpal = { version = "0.18", features = ["realtime-dbus"] }
audio_thread_priority = { version = "0.35", default-features = false, features = ["with_dbus"] }

# Hardware-accelerated stem separation where the platform provides it.
[target.'cfg(target_os = "macos")'.dependencies]
stem-splitter-core = { version = "1.2", default-features = false, features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
stem-splitter-core = { version = "1.2", default-features = false, features = ["directml"] }
