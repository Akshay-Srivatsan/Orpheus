[package]
name = "orpheus"
version = "0.1.0"
description = "Social dance DJ software"
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
orpheus-core = { path = "../core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
