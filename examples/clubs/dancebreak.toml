note = "Formerly called the Russian Mazurka Quadrille."
suggested = ["dawn-mazurka-168", "dawn-mazurka-epic-rp-edit"]



[style.accelerating-waltz]
name = "Accelerating Waltz"
color = "#fb7185"
meter = 3
note = "A rotary waltz that speeds up."
suggested = ["accelerating-waltz-lullaby-of-flame"]

[style.romany-polka]
name = "Romany Polka"
color = "#fbbf24"
note = "A choreography."
suggested = ["romany-polka-rp-edit"]

[style.shim-sham]
name = "Shim Sham"
color = "#60a5fa"
note = "A solo jazz routine."
suggested = ["shim-sham-taint-what-you-do"]
