# Friday Night Waltz, with Lucas Garron's "Social Dance Tempos": his tempo
# guidelines for variety social partner dancing, based on Richard Powers' and
# on DJing events like Friday Night Waltz. From
# https://garron.net/dance/tempos/ (October 2026).
# Tempos are beats per minute: "preferred" is his sweet range, "tempo" his
# extended range. Outside it is "rarely a good idea": change the song's tempo,
# except for an occasional special song (say so when you announce it). Meters
# are each dance's standard meter.

name = "Friday Night Waltz"
description = """Friday Night Waltz, with Lucas Garron's social dance tempos. Low in the extended range \
should feel more mellow, high in it should have more energy."""
website = "https://garron.net/dance/tempos/"
song_library = "songs.toml"

[set]
# A Friday-evening dance: 2¾ to 3 hours.
minutes = [165, 180]

[style.cross-step]
name = "Cross-Step Waltz"
color = "#a78bfa"
meter = 3
tempo = [105, 130]
preferred = [114, 122]

[style.rotary]
name = "Rotary Waltz"
short = "Waltz"
color = "#f472b6"
meter = 3
tempo = [135, 170]
preferred = [140, 160]

[style.fast-waltz]
name = "Fast Waltz"
color = "#fb7185"
meter = 3
tempo = [160, 210]
preferred = [170, 200]

[style.polka]
name = "Polka"
color = "#facc15"
meter = 2
tempo = [105, 140]
preferred = [110, 125]

[style.schottische]
name = "Schottische"
color = "#fde68a"
meter = 4
tempo = [145, 170]
preferred = [150, 165]

[style.one-step]
name = "One-Step"
color = "#fef08a"
meter = 2
tempo = [110, 135]
preferred = [115, 130]

[style.lindy]
name = "Lindy Hop"
short = "Swing"
color = "#fbbf24"
meter = 4
tempo = [135, 180]
preferred = [140, 170]

[style.sweet-lindy]
name = "Sweet Lindy"
color = "#fcd34d"
meter = 4
tempo = [110, 140]
preferred = [115, 135]

[style.six-count-swing]
name = "6-Count Swing"
color = "#fde047"
meter = 4
tempo = [80, 115]
preferred = [85, 105]

[style.four-count-swing]
name = "4-Count Swing"
color = "#facc15"
meter = 4
tempo = [115, 145]
preferred = [120, 140]

[style.wcs]
name = "West Coast Swing"
short = "WCS"
color = "#34d399"
meter = 4
tempo = [90, 130]
preferred = [100, 120]

[style.slow-jam]
name = "Slow Jam"
color = "#6366f1"
meter = 4
tempo = [60, 100]
preferred = [65, 90]

[style.hustle]
name = "Hustle"
color = "#e879f9"
meter = 4
tempo = [110, 130]
preferred = [115, 125]

[style.club-two-step]
name = "Nightclub Two-Step"
short = "NC2S"
color = "#c084fc"
meter = 4
tempo = [75, 90]
preferred = [80, 85]

[style.salsa]
name = "Salsa"
color = "#f97316"
meter = 4
tempo = [85, 110]
preferred = [90, 100]

[style.cha-cha]
name = "Cha-Cha"
color = "#fdba74"
meter = 4
tempo = [110, 130]
preferred = [115, 125]

[style.tango]
name = "Tango"
color = "#ef4444"
meter = 4
tempo = [115, 140]
preferred = [120, 130]

[style.foxtrot]
name = "Foxtrot"
color = "#94a3b8"
meter = 4
tempo = [130, 180]
preferred = [135, 170]

[style.quickstep]
name = "Quickstep"
color = "#7dd3fc"
meter = 4
tempo = [85, 110]
preferred = [90, 105]
note = "Counted in half time (full time about 180–210)."

[style.merengue]
name = "Merengue"
color = "#ea580c"
meter = 2
tempo = [110, 135]
preferred = [115, 130]

# ---------------------------------------------------------------- dances with their own music
# Each fits the songs it suggests (from songs.toml), found by fingerprint, Spotify track or file hash.

