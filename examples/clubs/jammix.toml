# Jammix: Richard Powers' DJ guidelines, "How to Be a Better Dance DJ".
# From https://socialdance.stanford.edu/Syllabi/DJtips.htm (October 2026).
# "These are mere suggestions… not absolute rules." Tempos are beats per
# minute for average or mixed-level social dancers; where he gives a second
# count in parentheses (half or double time), the one a tempo detector usually
# reports is used. Orpheus also matches songs at half or double these tempos.
# Meters are each dance's standard meter.

name = "Jammix"
description = """Jammix, following Richard Powers' DJ suggestions: \
about 3-minute songs, no two of the same dance in a row, no more than one or two \
really fast tunes in a row, and the energy should suit the tempo."""
website = "https://socialdance.stanford.edu/Syllabi/DJtips.htm"
song_library = "songs.toml"

[set]
# A Friday-evening dance: 2¾ to 3 hours.
minutes = [165, 180]
# "Ten or twenty seconds" between tunes, though he advises watching the dancers.
pause = { target = 10, min = 10, max = 20 }
# "Keep the tempo within 10% (above or below) of the sweet spot."
tempo_change = { faster = 10, slower = 10 }
fade_out = 5
# "Two tunes in a row for the same kind of dance, at the same tempo": avoid.
max_in_a_row = 1

[style.waltz]
name = "Waltz"
color = "#f472b6"
meter = 3
tempo = [138, 160]
preferred = 144
length = { max = "3:30" }
note = "Moderate (rotary / Viennese) waltz, intermediate level."

[style.fast-viennese]
name = "Fast Viennese Waltz"
color = "#fb7185"
meter = 3
tempo = [160, 190]
preferred = 168
length = { max = "3:00" }

